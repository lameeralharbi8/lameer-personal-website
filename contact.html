<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معي | لامير</title>
</head>
<body>

<header>
    <h1>تواصل معي</h1>

    <nav>
        <a href="index.html">الرئيسية</a>
        <a href="projects.html">مشاريعي</a>
        <a href="contact.html">تواصل معي</a>
    </nav>
</header>

<main>

    <section>
        <h2>نموذج التواصل</h2>

        <p>يسعدني استقبال رسائلكم واستفساراتكم.</p>

        <form action="" method="get">

            <p>
                <label for="name">الاسم:</label>
                <input type="text"
                       id="name"
                       name="name"
                       required>
            </p>

            <p>
                <label for="email">البريد الإلكتروني:</label>
                <input type="email"
                       id="email"
                       name="email"
                       required>
            </p>

            <p>
                <label for="reason">سبب التواصل:</label>
                <select id="reason" name="reason">
                    <option value="question">استفسار</option>
                    <option value="project">مشروع</option>
                    <option value="other">أخرى</option>
                </select>
            </p>

            <p>
                <label for="message">رسالتك:</label>
                <textarea id="message"
                          name="message"
                          rows="4"
                          minlength="20"
                          required></textarea>
            </p>

            <button type="submit">إرسال</button>

        </form>
    </section>

</main>

<footer>
    <p>جميع الحقوق محفوظة - لامير 2026</p>
</footer>

</body>
</html>
